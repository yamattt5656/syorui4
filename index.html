<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>書類印刷</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
  :root {
    --paper: #F2F3F1;
    --sheet: #FFFFFF;
    --ink: #1C2B3A;
    --muted: #6B7682;
    --line: #CDD2D7;
    --shu: #C23A2B;
    --focus: #2563EB;
    --r: 8px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    background: var(--paper); color: var(--ink);
    font-size: 16px; line-height: 1.5;
    padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px));
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  header {
    background: var(--sheet); border-bottom: 2px solid var(--ink);
    padding: calc(16px + env(safe-area-inset-top, 0px)) 24px 14px;
  }
  header h1 { margin: 0 auto; max-width: 1080px; font-size: 1.4rem; letter-spacing: .06em; }

  main { max-width: 1080px; margin: 0 auto; padding: 8px 24px 24px; }
  section { margin-top: 24px; }
  section h2 {
    font-size: .95rem; margin: 0 0 10px; padding-bottom: 6px;
    border-bottom: 1px solid var(--ink); letter-spacing: .04em;
  }
  .grid {
    display: grid; gap: 10px;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
  }

  .item {
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px;
    background: var(--sheet); border: 2px solid var(--line); border-radius: var(--r);
    padding: 10px 10px 10px 14px; min-height: 64px;
    user-select: none; cursor: pointer;
  }
  .item:hover { border-color: var(--muted); }
  .item.on { border-color: var(--ink); }
  .item.none { background: transparent; border-style: dashed; cursor: default; color: var(--muted); }

  .mark {
    width: 26px; height: 26px; border-radius: 5px; border: 2px solid var(--line);
    display: grid; place-items: center; background: var(--sheet);
  }
  .item.on .mark { background: var(--ink); border-color: var(--ink); }
  .item.on .mark::after {
    content: ""; width: 7px; height: 13px; margin-top: -3px;
    border: solid #fff; border-width: 0 3px 3px 0; transform: rotate(45deg);
  }
  .item.none .mark { visibility: hidden; }
  .name { font-weight: 700; font-size: 1.05rem; }
  .sub { font-size: .8rem; color: var(--muted); }

  .ctrl { display: flex; align-items: center; gap: 6px; }
  .stepper { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 5px; }
  .stepper button { width: 32px; height: 36px; border: none; background: none; font-size: 1.1rem; }
  .stepper button:disabled { color: var(--line); cursor: default; }
  .stepper output { min-width: 2.6em; text-align: center; font-size: .9rem; }
  .one {
    height: 38px; padding: 0 12px; border-radius: 5px;
    border: 1px solid var(--ink); background: var(--sheet); font-weight: 700; font-size: .9rem;
  }
  .one:hover { background: var(--ink); color: #fff; }

  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--ink); color: #fff;
    padding: 14px 24px calc(14px + env(safe-area-inset-bottom, 0px));
    display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap;
  }
  .count strong { font-size: 1.3rem; margin: 0 2px; }
  .clear {
    height: 44px; padding: 0 16px; border-radius: 5px;
    border: 1px solid rgba(255,255,255,.5); background: transparent; color: #fff;
  }
  .go {
    height: 48px; padding: 0 32px; border-radius: 5px; border: none;
    background: #fff; color: var(--ink); font-weight: 700; font-size: 1.05rem;
  }
  .go:disabled, .clear:disabled { opacity: .4; cursor: default; }

  .cover-opt { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; cursor: pointer; }
  .cover-opt input { width: 20px; height: 20px; margin: 0; accent-color: #fff; }

  dialog {
    border: 2px solid var(--ink); border-radius: var(--r); padding: 28px 28px 22px;
    width: min(92vw, 420px); color: var(--ink); background: var(--sheet);
  }
  dialog::backdrop { background: rgba(28, 43, 58, .45); }
  dialog p { margin: 4px 24px 22px 0; font-size: 1.2rem; font-weight: 700; }
  .ask-btns { display: flex; gap: 10px; }
  .ask-btns button { flex: 1; height: 52px; border-radius: 5px; font-weight: 700; font-size: 1.05rem; }
  .ask-no { border: 1px solid var(--line); background: var(--sheet); }
  .ask-yes { border: none; background: var(--ink); color: #fff; }
  .ask-x { position: absolute; top: 8px; right: 10px; border: none; background: none; font-size: 1.4rem; color: var(--muted); width: 40px; height: 40px; }

  .toast {
    position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom, 0px));
    transform: translate(-50%, 10px); opacity: 0; pointer-events: none; z-index: 20;
    background: var(--sheet); border: 1px solid var(--ink); border-radius: var(--r);
    padding: 12px 18px; max-width: min(92vw, 560px); font-size: .95rem;
    transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.err { border-color: var(--shu); color: var(--shu); }

  @media (max-width: 640px) {
    main { padding: 4px 14px 20px; }
    header { padding-left: 14px; padding-right: 14px; }
    .grid { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>

<header><h1 id="title">書類印刷</h1></header>
<main id="main"></main>

<div class="bar">
  <label class="cover-opt"><input type="checkbox" id="cover" checked> 頭紙をつける</label>
  <div class="count" id="count"></div>
  <button class="clear" id="clear">選択を解除</button>
  <button class="go" id="go">印刷</button>
</div>
<dialog id="ask" aria-labelledby="askText">
  <p id="askText">車庫証明はお客様出しですか？</p>
  <div class="ask-btns">
    <button value="yes" class="ask-yes">はい</button>
    <button value="no" class="ask-no">いいえ</button>
  </div>
  <button value="cancel" class="ask-x" aria-label="印刷をやめる">×</button>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

  document.title = TITLE;
  $("#title").textContent = TITLE;

  // 状態：書類ごとに 選択 と 部数
  const items = [];
  SECTIONS.forEach((sec, si) => sec.items.forEach((it, ii) =>
    items.push({
      id: si + "-" + ii, sec: sec.title, name: it.name, file: it.file, on: false, copies: 1,
      inList: sec.checklist !== false,
      obtain: !!sec.obtain,
      listName: it.listName || (sec.listName ? sec.listName.replace("{name}", it.name) : it.name),
    })));
  const byId = (id) => items.find((x) => x.id === id);

  // ---------- 表示 ----------
  function itemHtml(x) {
    if (!x.file && !x.obtain) {
      return `<div class="item none" data-id="${x.id}">
        <span class="mark"></span>
        <div><div class="name">${esc(x.name)}</div><div class="sub">未登録</div></div><span></span></div>`;
    }
    return `<div class="item ${x.on ? "on" : ""}" data-id="${x.id}" role="checkbox" aria-checked="${x.on}" tabindex="0">
      <span class="mark" aria-hidden="true"></span>
      <div class="name">${esc(x.name)}</div>
      <div class="ctrl">
        <div class="stepper">
          <button data-act="minus" aria-label="部数を減らす" ${x.copies <= 1 ? "disabled" : ""}>−</button>
          <output>${x.copies}部</output>
          <button data-act="plus" aria-label="部数を増やす" ${x.copies >= 20 ? "disabled" : ""}>＋</button>
        </div>
        ${x.obtain ? "" : `<button class="one" data-act="print">印刷</button>`}
      </div>
    </div>`;
  }

  function render() {
    $("#main").innerHTML = SECTIONS.map((sec) => `
      <section>
        <h2>${esc(sec.title)}</h2>
        <div class="grid">${items.filter((x) => x.sec === sec.title).map(itemHtml).join("")}</div>
      </section>`).join("");
    updateBar();
  }

  function redraw(x, focusSel) {
    const el = document.querySelector(`.item[data-id="${x.id}"]`);
    el.outerHTML = itemHtml(x);
    const again = document.querySelector(`.item[data-id="${x.id}"]` + (focusSel ? " " + focusSel : ""));
    if (again) again.focus();
    updateBar();
  }

  function updateBar() {
    const sel = items.filter((x) => x.on);
    const n = sel.reduce((a, x) => a + x.copies, 0);
    $("#count").innerHTML = sel.length ? `<strong>${sel.length}</strong>種類・計<strong>${n}</strong>部` : "印刷する書類を選んでください";
    $("#go").disabled = !sel.length;
    $("#clear").disabled = !sel.length;
  }

  $("#main").addEventListener("click", (e) => {
    const card = e.target.closest(".item");
    if (!card || card.classList.contains("none")) return;
    const x = byId(card.dataset.id);
    const btn = e.target.closest("[data-act]");
    if (btn) {
      const act = btn.dataset.act;
      if (act === "print") { startPrint([x]); return; }
      if (act === "minus") x.copies = Math.max(1, x.copies - 1);
      if (act === "plus") { x.copies = Math.min(20, x.copies + 1); x.on = true; }
      redraw(x, `[data-act="${act}"]`);
      return;
    }
    x.on = !x.on;
    redraw(x);
  });
  $("#main").addEventListener("keydown", (e) => {
    const card = e.target.closest(".item");
    if (!card || e.target !== card || !(e.key === " " || e.key === "Enter")) return;
    e.preventDefault();
    const x = byId(card.dataset.id);
    x.on = !x.on;
    redraw(x);
  });

  $("#clear").addEventListener("click", () => {
    items.forEach((x) => { x.on = false; x.copies = 1; });
    render();
  });
  $("#go").addEventListener("click", () => {
    const sel = items.filter((x) => x.on);
    if (sel.length) startPrint(sel);
  });

  // ---------- 頭紙 ----------
  const dlg = $("#ask");
  let preWin = null;   // スマホ：ボタンを押した瞬間にタブを開いておく（ポップアップブロック対策）
  dlg.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
    if (isMobile && b.value !== "cancel") preWin = window.open("", "_blank");
    dlg.close(b.value);
  }));

  function askGarage() {
    return new Promise((resolve) => {
      dlg.returnValue = "cancel";
      dlg.addEventListener("close", () => resolve(dlg.returnValue || "cancel"), { once: true });
      dlg.showModal();
      dlg.querySelector(".ask-yes").focus();
    });
  }

  async function startPrint(list) {
    let cover = null;
    if ($("#cover").checked) {
      const ans = await askGarage();
      if (ans === "cancel") return;
      const hide = ans === "yes" ? (COVER.garageHide || []) : [];
      const rows = list
        .filter((x) => x.inList && !hide.includes(x.name))
        .map((x) => ({ name: x.listName, copies: x.copies }));
      if (ans === "yes") rows.push({ name: COVER.garageItem, copies: 1 });
      if (rows.length) cover = rows;
    }
    const docs = list.filter((x) => !x.obtain);   // 役所で取得する書類は印刷しない
    if (!docs.length && !cover) {
      toast("印刷する書類がありません。役所などで取得する書類は、頭紙をつけると返送リストに載ります。", true);
      return;
    }
    printItems(docs, cover);
  }

  // A4縦の頭紙を画像として描く（日本語フォントをPDFに埋め込まずに済むため）
  async function drawCover(rows) {
    const F = '"BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif';
    try { await Promise.all([document.fonts.load(`700 20px "BIZ UDPGothic"`), document.fonts.load(`400 20px "BIZ UDPGothic"`)]); } catch (_) {}
    const S = 2.5, W = 595.28, H = 841.89;          // pt単位で描いて S 倍で出力
    const c = document.createElement("canvas");
    c.width = Math.round(W * S); c.height = Math.round(H * S);
    const g = c.getContext("2d");
    g.scale(S, S);
    g.fillStyle = "#fff"; g.fillRect(0, 0, W, H);
    g.fillStyle = "#000"; g.strokeStyle = "#000"; g.textBaseline = "alphabetic";
    const L = 56, Rt = W - 56;
    const text = (t, x, y, size, bold, align) => {
      g.font = `${bold ? 700 : 400} ${size}px ${F}`; g.textAlign = align || "left"; g.fillText(t, x, y);
    };
    const line = (x1, y1, x2, y2, w) => { g.lineWidth = w || 0.8; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); };

    text(COVER.title, W / 2, 100, 22, true, "center");
    line(L, 116, Rt, 116, 1.5);
    text(COVER.message, L, 156, 11, false);

    // 表
    let y = 190;
    const rowH = 40;
    text("確認", L + 14, y, 10, true, "center");
    text("書類", L + 44, y, 10, true);
    text("部数", Rt - 10, y, 10, true, "right");
    y += 8; line(L, y, Rt, y, 1.2);
    const all = rows.concat(Array.from({ length: COVER.blankRows || 0 }, () => null));
    all.forEach((r) => {
      g.lineWidth = 1; g.strokeRect(L + 6, y + 12, 16, 16);
      if (r) {
        text(r.name, L + 44, y + 26, 14, true);
        text(`${r.copies}部`, Rt - 10, y + 26, 12, false, "right");
      }
      y += rowH; line(L, y, Rt, y);
    });

    if (COVER.shop) text(COVER.shop, Rt, H - 60, 11, false, "right");
    return new Promise((res) => c.toBlob((b) => b.arrayBuffer().then(res), "image/png"));
  }

  // ---------- 印刷 ----------
  const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

  let timer;
  function toast(msg, err) {
    const t = $("#toast");
    t.textContent = msg;
    t.className = "toast show" + (err ? " err" : "");
    clearTimeout(timer);
    timer = setTimeout(() => (t.className = "toast"), err ? 7000 : 3000);
  }

  // ファイルの置き場所がずれていても見つけられるよう、いくつかの場所を順に探す
  async function load(file) {
    if (location.protocol === "file:") {
      throw new Error("パソコン上で直接開くと読み込めません。公開したURLから使ってください。");
    }
    const base = file.split("/").pop();
    const tries = [...new Set([file, base, "pdf/" + base, "mihon/" + base, "pdf/還付/" + base])];
    for (const p of tries) {
      for (const name of new Set([p.normalize("NFC"), p.normalize("NFD")])) {
        try {
          const res = await fetch(encodeURI(name), { cache: "no-cache" });
          if (res.ok) return res.arrayBuffer();
        } catch (_) { /* 次の候補へ */ }
      }
    }
    return null;   // 見つからない
  }

  // 選んだ書類を部数分つなげて1つのPDFにする（画像はA4横1枚に収める）
  async function build(list, cover) {
    const { PDFDocument } = PDFLib;
    const out = await PDFDocument.create();
    if (cover) {
      const img = await out.embedPng(await drawCover(cover));
      out.addPage([595.28, 841.89]).drawImage(img, { x: 0, y: 0, width: 595.28, height: 841.89 });
    }
    const missing = [];
    let added = 0;
    for (const x of list) {
      const bytes = await load(x.file);
      if (!bytes) { missing.push(x.file.split("/").pop()); continue; }
      added++;
      if (/\.pdf$/i.test(x.file)) {
        const src = await PDFDocument.load(bytes);
        for (let c = 0; c < x.copies; c++) {
          (await out.copyPages(src, src.getPageIndices())).forEach((p) => out.addPage(p));
        }
      } else {
        const png = new Uint8Array(bytes)[0] === 0x89;
        const img = png ? await out.embedPng(bytes) : await out.embedJpg(bytes);
        const W = 841.89, H = 595.28, M = 28;
        const k = Math.min((W - M * 2) / img.width, (H - M * 2) / img.height);
        const w = img.width * k, h = img.height * k;
        for (let c = 0; c < x.copies; c++) {
          out.addPage([W, H]).drawImage(img, { x: (W - w) / 2, y: (H - h) / 2, width: w, height: h });
        }
      }
    }
    if (!added && !cover) throw new Error(`${missing.join("、")} が見つかりません。GitHubにこのファイルがあるか確認してください。`);
    return { blob: new Blob([await out.save()], { type: "application/pdf" }), missing };
  }

  async function printItems(list, cover) {
    const win = preWin || (isMobile ? window.open("", "_blank") : null);   // スマホは新しいタブで開く
    preWin = null;
    toast("印刷の準備をしています…");
    try {
      const { blob, missing } = await build(list, cover);
      const url = URL.createObjectURL(blob);
      const warn = missing.length ? `（${missing.join("、")} が見つからないため除きました）` : "";
      if (win) { win.location.href = url; toast("共有ボタンから印刷してください。" + warn, !!warn); return; }
      const old = document.getElementById("pf");
      if (old) old.remove();
      const f = document.createElement("iframe");
      f.id = "pf";
      f.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0;";
      f.onload = () => setTimeout(() => {
        try { f.contentWindow.focus(); f.contentWindow.print(); toast("印刷画面を開きました。" + warn, !!warn); }
        catch (_) { window.open(url, "_blank"); toast("新しいタブから印刷してください。"); }
      }, 300);
      f.src = url;
      document.body.appendChild(f);
    } catch (err) {
      if (win) win.close();
      toast(err.message, true);
    }
  }

  render();
})();
</script>
</body>
</html>
